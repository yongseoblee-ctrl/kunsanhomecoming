<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>군산CCC 순찬양대회 참가자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --purple:#6f1def;
  --purple-deep:#3d0d8a;
  --purple-text:#6f1def;
  --green:#248200;
  --lamp:#ffd27a;
  --bg:#ffffff;
  --surface:#f6f2fd;
  --text:#1c1530;
  --muted:#5b5470;
  --line:#e4dcf5;
  --gear-bg:#fff3d6;
  --gear-ink:#6b4a00;
  --on-brand:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#140f22;--surface:#1f1833;--text:#f2eefb;--muted:#b4abc9;--line:#342a4d;
    --purple-text:#b892ff;--gear-bg:#3a2e12;--gear-ink:#ffd27a;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#140f22;--surface:#1f1833;--text:#f2eefb;--muted:#b4abc9;--line:#342a4d;
  --purple-text:#b892ff;--gear-bg:#3a2e12;--gear-ink:#ffd27a;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-weight:500;font-size:17px;line-height:1.7;word-break:keep-all}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#fff}
:focus-visible{outline:3px solid var(--green);outline-offset:3px;border-radius:4px}

/* 상단 메뉴: 홈커밍데이와 동일 */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:#fff;border-bottom:1px solid #ece6f8}
.nav-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;color:#1c1530}
.brand img{height:30px;width:auto}
.theme{background:transparent;border:1px solid #e4dcf5;color:#3d0d8a;border-radius:999px;padding:5px 14px;cursor:pointer;font:inherit;font-size:14px}

/* 히어로 */
.hero{background:linear-gradient(var(--purple-deep),var(--purple) 75%);color:var(--on-brand)}
.hero-in{max-width:1040px;margin:0 auto;padding:52px 20px 48px}
.eyebrow{display:inline-block;font-size:15px;font-weight:700;background:rgba(255,255,255,.14);padding:6px 14px;border-radius:999px;margin-bottom:16px}
.hero h1{margin:0;font-weight:800;font-size:clamp(36px,7vw,64px);line-height:1.2;letter-spacing:-.02em}
.hero p{margin:16px 0 0;max-width:32em;opacity:.92;font-size:18px}

/* 본문 */
.wrap{max-width:1040px;margin:0 auto;padding:40px 20px 64px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.tabs{display:flex;gap:8px}
.tab{font:inherit;font-weight:700;font-size:16px;cursor:pointer;padding:10px 24px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.tab[aria-selected="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
.count{color:var(--muted);font-size:15px}

.list{list-style:none;margin:0;padding:0;border-top:2px solid var(--purple)}
.item{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:16px;align-items:center;padding:22px 4px}
.no{font-weight:700;font-size:26px;line-height:1;color:var(--purple-text);text-align:center;font-variant-numeric:tabular-nums}
.team{margin:0;font-size:15px;color:var(--purple-text);font-weight:700}
.song{margin:2px 0 10px;font-size:22px;line-height:1.35;font-weight:700;letter-spacing:-.01em}
.members{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface);color:var(--text);border:1px solid var(--line);padding:2px 12px;border-radius:999px;font-size:14px}
.chip.maybe{background:transparent;border-style:dashed;color:var(--muted)}

.play{width:60px;height:60px;border-radius:50%;border:0;cursor:pointer;background:var(--green);color:#fff;display:grid;place-items:center}
.play:hover{filter:brightness(1.1)}
.play[aria-expanded="true"]{background:var(--purple)}
.play svg{width:24px;height:24px;fill:currentColor}
.nolink{color:var(--muted);font-size:14px;text-align:center;width:60px}
.gear{display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:11em}
.gear-item{background:var(--gear-bg);color:var(--gear-ink);padding:4px 12px;border-radius:8px;font-size:14px;font-weight:700;white-space:nowrap}

.player{display:none;padding:0 4px 24px 64px}
.item.on .player{display:block}
.frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.open{display:inline-block;margin-top:10px;color:var(--purple-text);font-size:14px}
.empty{padding:56px 8px;text-align:center;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface)}

footer{text-align:center;padding:32px 20px 40px;color:var(--muted);font-size:14px}

@media (max-width:560px){
  .row{grid-template-columns:30px 1fr}
  .play,.nolink,.gear{grid-column:2;justify-self:start}
  .gear{flex-direction:row;flex-wrap:wrap;align-items:flex-start;max-width:none}
  .nolink{width:auto;text-align:left}
  .player{padding-left:4px}
  .no{font-size:20px}
  .song{font-size:20px}
}
</style>
</head>

 var TEAMS = DATA[tab] || [];
 countEl.textContent = (tab === "nazareth" ? "나사렛 " : "재학생 ") + TEAMS.length + "팀";
 document.querySelectorAll(".tab").forEach(function (b) {
   b.setAttribute("aria-selected", b.dataset.tab === tab ? "true" : "false");
 });
 list.setAttribute("aria-labelledby", "tab-" + tab);
 if (!TEAMS.length) {
   var e = el("li", "empty", "나사렛 팀 자료는 아직 준비 중입니다. 곧 업데이트됩니다.");
   list.appendChild(e);
   return;
 }
TEAMS.forEach(function (t, i) {
  var li = el("li", "item");
  li.dataset.song = t.song;

  var row = el("div", "row");
  row.appendChild(el("div", "no", String(i + 1)));

  var info = el("div", "info");
  info.appendChild(el("p", "team", t.team));
  info.appendChild(el("h2", "song", t.song));
  var ms = el("div", "members");
  t.members.forEach(function (m) {
    var maybe = m.charAt(0) === "(";
    ms.appendChild(el("span", "chip" + (maybe ? " maybe" : ""), m));
  });
  info.appendChild(ms);
  row.appendChild(info);

  if (t.yt) {
    var btn = el("button", "play");
    btn.type = "button";
    btn.innerHTML = PLAY;
    btn.setAttribute("aria-label", t.song + " 재생");
    btn.setAttribute("aria-expanded", "false");
    row.appendChild(btn);

    var player = el("div", "player");
    var frame = el("div", "frame");
    player.appendChild(frame);
    var a = el("a", "open", "오류가 뜨면 여기를 눌러 YouTube에서 재생");
    a.href = "https://www.youtube.com/watch?v=" + t.yt;
    a.target = "_blank"; a.rel = "noopener";
    player.appendChild(a);

    btn.addEventListener("click", function () {
      var wasOn = li.classList.contains("on");
      closeAll();
      if (wasOn) return;
      var ifr = document.createElement("iframe");
      ifr.src = "https://www.youtube.com/embed/" + t.yt + "?autoplay=1&rel=0&playsinline=1&origin=" + encodeURIComponent(location.origin);
      ifr.title = t.team + " - " + t.song;
      ifr.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
      ifr.allowFullscreen = true;
      ifr.referrerPolicy = "strict-origin-when-cross-origin";
      frame.appendChild(ifr);
      li.classList.add("on");
      btn.setAttribute("aria-expanded", "true");
      btn.setAttribute("aria-label", t.song + " 정지");
      btn.innerHTML = STOP;
    });

    li.appendChild(row);
    li.appendChild(player);
  } else {
    if (t.need) {
      var gear = el("div", "gear");
      gear.setAttribute("aria-label", "필요한 악기: " + t.need);
      t.need.split(",").forEach(function (g) {
        g = g.trim();
        if (g) gear.appendChild(el("span", "gear-item", g));
      });
      row.appendChild(gear);
    } else {
      row.appendChild(el("div", "nolink", "MR 링크 없음"));
    }
    li.appendChild(row);
  }
  list.appendChild(li);
});
}

document.querySelectorAll(".tab").forEach(function (b) {
  b.addEventListener("click", function () {
    render(b.dataset.tab);
    try { history.replaceState(null, "", "#" + b.dataset.tab); } catch (e) {}
  });
});
render(location.hash === "#nazareth" ? "nazareth" : "student");

document.getElementById("theme").addEventListener("click", function () {
  var root = document.documentElement;
  var dark = root.getAttribute("data-theme") === "dark" ||
    (!root.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-theme", dark ? "light" : "dark");
});
</script>
</body>
</html>
